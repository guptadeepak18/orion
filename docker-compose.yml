version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: crc_one_db
    environment:
      POSTGRES_USER: crc_one
      POSTGRES_PASSWORD: crc_one_password
      POSTGRES_DB: crc_one
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crc_one -d crc_one"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crc_one_backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app
    volumes:
      - ./backend:/app
      - uploads_data:/data/uploads
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://crc_one:crc_one_password@db:5432/crc_one
      - JWT_SECRET_KEY=crc_one_super_secret_jwt_key_2026_change_in_prod
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - LLM_PROVIDER=anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ENVIRONMENT=local
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8000
      - FILE_STORAGE_PATH=/data/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crc_one_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
